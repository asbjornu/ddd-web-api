spring:
  application:
    name: elevator-api
  security:
    oauth2:
      resourceserver:
        jwt:
          # Tokens are validated by signature against the keys this issuer
          # publishes. elevator-api holds no secret of its own any more.
          issuer-uri: ${OAUTH_ISSUER:http://localhost:9000}
  datasource:
    url: jdbc:h2:mem:elevator;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

elevator:
  floors: 9
  recall-floor: 1
  travel-seconds-per-floor: 2
  door-open-timeout-seconds: 6
  weight-capacity-kg: 800
  uri:
    # readable (default) or opaque -- see shared.web.UriResolver. CI runs
    # the suite against both, per docs/plan.html section 8's "test that
    # settles it".
    style: readable
