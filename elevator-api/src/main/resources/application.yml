spring:
  application:
    name: elevator-api
  datasource:
    url: jdbc:h2:mem:elevator;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

elevator:
  floors: 9
  recall-floor: 1
  travel-seconds-per-floor: 2
  door-open-timeout-seconds: 6
  weight-capacity-kg: 800
  technician-key: ${TECHNICIAN_KEY:dev-secret-key}
