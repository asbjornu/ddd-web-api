# Markdown lint for the repository's prose, which carries as much of this
# project as its code does.
name: docs

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: Markdown lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci

      - run: npm run lint:md
