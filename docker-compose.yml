services:
  elevator-api:
    container_name: elevator-api
    build:
      context: ./elevator-api
    ports:
      - "8080:8080"
    environment:
      TECHNICIAN_KEY: dev-secret-key
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 3s
      timeout: 2s
      retries: 10
      start_period: 20s

  elevator-ui:
    container_name: elevator-ui
    build:
      context: ./elevator-ui
    ports:
      - "3000:3000"
    environment:
      NUXT_SERVICE_API_URL: http://elevator-api:8080
      NUXT_TECHNICIAN_KEY: dev-secret-key
    depends_on:
      elevator-api:
        condition: service_healthy
    volumes:
      - ./elevator-ui:/app
      - /app/node_modules
    command: npm run dev
