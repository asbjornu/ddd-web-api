services:
  elevator-auth:
    container_name: elevator-auth
    build:
      context: ./elevator-auth
    # Bound to loopback, like the others: the proxy in slice 0 will make
    # these unnecessary, but until then nothing here belongs on the network.
    ports:
      - "127.0.0.1:9000:9000"
    environment:
      # Tokens carry this as their issuer and elevator-api validates against
      # it, so both must use the name that resolves inside this network.
      OAUTH_ISSUER: http://elevator-auth:9000
      TECHNICIAN_CLIENT_ID: elevator-technician
      # What a technician types into the key-switch field.
      TECHNICIAN_CLIENT_SECRET: dev-secret-key
    healthcheck:
      test:
        - CMD
        - curl
        - -f
        - http://localhost:9000/.well-known/oauth-authorization-server
      interval: 3s
      timeout: 2s
      retries: 10
      start_period: 20s

  elevator-api:
    container_name: elevator-api
    build:
      context: ./elevator-api
    ports:
      # Bound to loopback rather than 0.0.0.0. Eight of this API's ten
      # endpoints are unauthenticated and several have side effects --
      # POST /elevators/{id}/obstruction needs no credential and sets a flag
      # that persists until cleared, which stops the lift until someone
      # clears it. Publishing on all interfaces puts that on whatever
      # network the host is attached to, which for a conference demo is a
      # live hazard rather than a theoretical one. See "Authentication and
      # authorization" in docs/architecture.md.
      - "127.0.0.1:8080:8080"
    environment:
      OAUTH_ISSUER: http://elevator-auth:9000
    depends_on:
      elevator-auth:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 3s
      timeout: 2s
      retries: 10
      start_period: 20s

  elevator-ui:
    container_name: elevator-ui
    build:
      context: ./elevator-ui
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      NUXT_SERVICE_API_URL: http://elevator-api:8080
      NUXT_OAUTH_ISSUER: http://elevator-auth:9000
      NUXT_OAUTH_CLIENT_ID: elevator-technician
    depends_on:
      elevator-api:
        condition: service_healthy
      elevator-auth:
        condition: service_healthy
    volumes:
      - ./elevator-ui:/app
      - /app/node_modules
    command: npm run dev
